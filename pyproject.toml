[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poppy-reviewer"
version = "0.1.0"
description = "A personal automatic GitHub pull-request reviewer."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "openai-codex>=0.147.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "pyjwt[crypto]>=2.13.0",
  "uvicorn>=0.52.4",
]

[project.scripts]
poppy = "poppy.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  "respx>=0.23.1",
  "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/poppy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not container'"
asyncio_mode = "auto"
markers = [
  "container: validates the network-built production container with a Docker daemon",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["poppy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["poppy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
