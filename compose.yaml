services:
  poppy:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_URL_POPPY_8000: /
      POPPY_DATA_DIR: /var/lib/poppy
      POPPY_CODEX_HOME: /var/lib/poppy/codex
      POPPY_CODEX_WORKSPACE: /var/empty/poppy
      POPPY_LISTEN_HOST: 0.0.0.0
      POPPY_LISTEN_PORT: 8000
    expose:
      - "8000"
    volumes:
      - poppy_data:/var/lib/poppy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  poppy_data:
